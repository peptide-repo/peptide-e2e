name: CI Bisect Test v3

on:
  workflow_call:
    inputs:
      tests:
        type: string
        required: false
        default: stubs

# No top-level permissions — only job-level where needed

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - run: echo "phpcs with write"
  
  phpunit:
    name: PHPUnit
    runs-on: ubuntu-latest
    if: ${{ inputs.tests != 'none' }}
    steps:
      - run: echo "phpunit ${{ inputs.tests }}"
