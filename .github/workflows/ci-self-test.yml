# Self-test: exercises the reusable ci.yml on this repo itself.
# Uses tests: none (peptide-e2e is a Playwright/Node repo, no PHP suite).
# Purpose: smoke-check that the reusable workflow parses and the job
# skeleton runs without YAML/startup errors.
#
# Note: uses a relative path (./.github/workflows/ci.yml) — the correct
# form for same-repo reusable workflow calls on PR branches.

name: CI Self-Test (reusable ci.yml)

on:
  push:
    branches: [main, 'claude/**']
  pull_request:
    branches: [main]

jobs:
  ci:
    uses: ./.github/workflows/ci.yml
    with:
      tests: none
      enforce_300: false
      has_js: false
      phpcs_autofix: false
    secrets: inherit
